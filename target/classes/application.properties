spring.application.name=acceso-api

spring.datasource.url=jdbc:mysql://localhost:3306/parque_acceso?useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Tamano maximo permitido para la plantilla Excel que suben los concesionarios
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
